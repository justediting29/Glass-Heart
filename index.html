<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Heart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: #f7f3f1;
  color: #403638;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  padding: 24px;
  text-align: center;
  background: #eadcda;
}

header h1 {
  margin: 0;
  letter-spacing: 5px;
  font-size: 30px;
}

header p {
  margin-bottom: 0;
  font-style: italic;
}

main {
  max-width: 850px;
  margin: 35px auto;
  padding: 20px;
}

.panel {
  background: #fffdfc;
  border: 1px solid #eadfdd;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 4px 18px #00000008;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #d9c9c6;
  border-radius: 7px;
  background: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button.primary {
  border: 0;
  background: #9d777b;
  color: white;
  padding: 10px 18px;
  border-radius: 7px;
}

button.primary:hover {
  background: #805e62;
}

.hidden {
  display: none !important;
}

.chapter-list {
  display: grid;
  gap: 10px;
}

.chapter-item {
  padding: 13px;
  border: 1px solid #e8d9d7;
  border-radius: 7px;
  background: #fff;
  text-align: left;
}

.chapter-item:hover {
  background: #f5eae8;
}

#story {
  line-height: 1.9;
  font-size: 17px;
}

.story-paragraph {
  margin: 20px 0;
}

.sentence {
  display: inline;
}

.sentence-comment-btn {
  display: inline-block;
  vertical-align: super;
  font-family: Arial, sans-serif;
  font-size: 10px;
  line-height: 1;
  margin: 0 3px;
  padding: 3px 5px;
  border: 0;
  border-radius: 10px;
  background: #eadcda;
  color: #76575b;
  cursor: pointer;
}

.sentence-comment-btn:hover {
  background: #d9bfc0;
}

.sentence-discussion {
  display: none;
  margin: 10px 0 20px;
  padding: 15px;
  background: #faf2f1;
  border-left: 3px solid #b68e91;
  border-radius: 6px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.sentence-discussion.open {
  display: block;
}

.sentence-comment {
  padding: 10px 0;
  border-bottom: 1px solid #eadcda;
}

.sentence-comment strong {
  color: #805e62;
}

.sentence-comment small {
  color: #99888a;
}

.reply {
  margin-left: 18px;
  padding-left: 10px;
  border-left: 2px solid #dfc9c8;
}

.comment-form {
  margin-top: 12px;
}

#comments {
  margin-top: 15px;
}

.comment {
  border-bottom: 1px solid #eadcda;
  padding: 12px 0;
}

.comment strong {
  color: #805e62;
}

footer {
  text-align: center;
  padding: 25px;
  color: #99888a;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>GLASS HEART</h1>
  <p>Some stories are written in silence.</p>
</header>

<main>
  <section id="home" class="panel">
    <h2>Welcome to Glass Heart</h2>
    <p>A little place for stories, thoughts, and words.</p>
    <button class="primary" onclick="showChapters()">Read the story</button>
  </section>

  <section id="chapterMenu" class="panel hidden">
    <h2>Chapters</h2>
    <div id="chapterList" class="chapter-list"></div>
    <button class="primary" onclick="goHome()">Back</button>
  </section>

  <section id="reader" class="panel hidden">
    <button onclick="showChapters()">← Chapters</button>
    <h2 id="chapterTitle"></h2>
    <div id="story"></div>

    <hr>

    <h3>Chapter Discussion</h3>
    <div id="comments"></div>

    <div class="comment-form">
      <input id="chapterName" placeholder="Your name">
      <textarea id="chapterComment" placeholder="Write a comment..."></textarea>
      <button class="primary" onclick="postChapterComment()">Post comment</button>
    </div>
  </section>
</main>

<footer>GLASS HEART · A STORY SHARED</footer>
<script>
// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://qswgpgjokzixzofylikr.supabase.co";
const SUPABASE_KEY = "sb_publishable_rdU79hSv-rt1TtN5DnFvFQ_tk5QHWsk";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentChapter = 1;

// CONTOH ISI CERITA
// Ganti bagian ini dengan isi cerita asli kamu.
const paragraphs = [
  "The sky was quiet that evening. I watched the rain fall against the window, wondering if some things were meant to be forgotten.",
  "There was something strange about silence. Sometimes it said more than words ever could.",
  "I remembered the way you smiled, and how foolishly I believed that it would last forever."
];

function showChapters() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("reader").classList.add("hidden");
  document.getElementById("chapterMenu").classList.remove("hidden");

  const list = document.getElementById("chapterList");
  list.innerHTML = "";

  for (let i = 1; i <= 50; i++) {
    const button = document.createElement("button");
    button.className = "chapter-item";
    button.textContent = "Chapter " + i;
    button.onclick = () => openChapter(i);
    list.appendChild(button);
  }
}

function goHome() {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("chapterMenu").classList.add("hidden");
  document.getElementById("reader").classList.add("hidden");
}

function openChapter(n) {
  currentChapter = n;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("chapterMenu").classList.add("hidden");
  document.getElementById("reader").classList.remove("hidden");

  document.getElementById("chapterTitle").textContent = "Chapter " + n;

  renderChapter(n);
  loadChapterComments();
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

// RENDER CERITA DAN TOMBOL KOMENTAR PER KALIMAT
function renderChapter(n) {
  const story = document.getElementById("story");
  story.innerHTML = "";

  paragraphs.forEach((paragraph, pIndex) => {
    const p = document.createElement("p");
    p.className = "story-paragraph";

    const sentences = paragraph.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [paragraph];

    sentences.forEach((sentence, sIndex) => {
      const key = `chapter-${n}-p-${pIndex}-s-${sIndex}`;

      const span = document.createElement("span");
      span.className = "sentence";
      span.textContent = sentence + " ";

      const button = document.createElement("button");
      button.className = "sentence-comment-btn";
      button.textContent = "...";
      button.title = "Open sentence comments";
      button.onclick = () => toggleSentenceDiscussion(key, box, button);

      const box = document.createElement("div");
      box.className = "sentence-discussion";
      box.id = "discussion-" + key;

      p.appendChild(span);
      p.appendChild(button);
      p.appendChild(box);

      loadSentenceCount(key, button);
    });

    story.appendChild(p);
  });
}

// LOAD JUMLAH KOMENTAR
async function loadSentenceCount(key, button) {
  const { count, error } = await db
    .from("reader_comments")
    .select("*", { count: "exact", head: true })
    .eq("passage_key", key);

  if (error) {
    button.textContent = "!";
    console.error(error);
    return;
  }

  button.textContent = String(count || 0);
}

// BUKA / TUTUP DISKUSI KALIMAT
async function toggleSentenceDiscussion(key, box, button) {
  box.classList.toggle("open");

  if (!box.classList.contains("open")) return;

  await renderSentenceComments(key, box);
}

// TAMPILKAN KOMENTAR DAN BALASAN
async function renderSentenceComments(key, box) {
  box.innerHTML = "<p>Loading comments...</p>";

  const { data, error } = await db
    .from("reader_comments")
    .select("*")
    .eq("passage_key", key)
    .order("created_at", { ascending: true });

  if (error) {
    box.innerHTML = "<p>Could not load comments.</p>";
    console.error(error);
    return;
  }

  const roots = data.filter(c => !c.parent_id);

  let html = "";

  roots.forEach(comment => {
    html += `
      <div class="sentence-comment">
        <strong>${esc(comment.author_name)}</strong>
        <p>${esc(comment.body)}</p>
        <button onclick="replyToSentence('${esc(comment.id)}','${esc(key)}')">
          Reply
        </button>
    `;

    const replies = data.filter(c => c.parent_id === comment.id);

    replies.forEach(reply => {
      html += `
        <div class="reply">
          <strong>${esc(reply.author_name)}</strong>
          <p>${esc(reply.body)}</p>
        </div>
      `;
    });

    html += "</div>";
  });

  box.innerHTML = html || "<p>No comments yet.</p>";

  box.innerHTML += `
    <div class="comment-form">
      <input id="name-${key}" placeholder="Your name">
      <textarea id="body-${key}" placeholder="Write your thoughts..."></textarea>
      <button class="primary" onclick="postSentenceComment('${key}', null)">
        Post comment
      </button>
    </div>
  `;
}

// KIRIM KOMENTAR KALIMAT
async function postSentenceComment(key, parentId) {
  const nameInput = document.getElementById("name-" + key);
  const bodyInput = document.getElementById("body-" + key);

  const name = nameInput.value.trim();
  const body = bodyInput.value.trim();

  if (!name || !body) {
    alert("Please enter your name and comment.");
    return;
  }

  const { error } = await db.from("reader_comments").insert({
    chapter: currentChapter,
    passage_id: null,
    passage_key: key,
    parent_id: parentId,
    author_name: name,
    body: body
  });

  if (error) {
    alert("Could not post comment: " + error.message);
    return;
  }

  const box = document.getElementById("discussion-" + key);
  await renderSentenceComments(key, box);

  const button = box.previousElementSibling;
  await loadSentenceCount(key, button);
}

// BALAS KOMENTAR KALIMAT
async function replyToSentence(parentId, key) {
  const name = prompt("Your name:");
  if (!name) return;

  const body = prompt("Write your reply:");
  if (!body) return;

  const { error } = await db.from("reader_comments").insert({
    chapter: currentChapter,
    passage_id: null,
    passage_key: key,
    parent_id: parentId,
    author_name: name.trim(),
    body: body.trim()
  });

  if (error) {
    alert("Could not post reply: " + error.message);
    return;
  }

  const box = document.getElementById("discussion-" + key);
  await renderSentenceComments(key, box);
}

// KOMENTAR CHAPTER BIASA
async function loadChapterComments() {
  const container = document.getElementById("comments");
  container.innerHTML = "<p>Loading...</p>";

  const { data, error } = await db
    .from("reader_comments")
    .select("*")
    .eq("chapter", currentChapter)
    .is("passage_id", null)
    .is("passage_key", null)
    .order("created_at", { ascending: true });

  if (error) {
    container.innerHTML = "<p>Could not load comments.</p>";
    console.error(error);
    return;
  }

  container.innerHTML = "";

  data.forEach(comment => {
    const div = document.createElement("div");
    div.className = "comment";
    div.innerHTML = `
      <strong>${esc(comment.author_name)}</strong>
      <p>${esc(comment.body)}</p>
    `;
    container.appendChild(div);
  });

  if (data.length === 0) {
    container.innerHTML = "<p>No comments yet.</p>";
  }
}

// KIRIM KOMENTAR CHAPTER
async function postChapterComment() {
  const name = document.getElementById("chapterName").value.trim();
  const body = document.getElementById("chapterComment").value.trim();

  if (!name || !body) {
    alert("Please enter your name and comment.");
    return;
  }

  const { error } = await db.from("reader_comments").insert({
    chapter: currentChapter,
    passage_id: null,
    passage_key: null,
    parent_id: null,
    author_name: name,
    body: body
  });

  if (error) {
    alert("Could not post comment: " + error.message);
    return;
  }

  document.getElementById("chapterComment").value = "";
  await loadChapterComments();
}

// TAMPILKAN HALAMAN AWAL
goHome();
</script>

</body>
</html>
